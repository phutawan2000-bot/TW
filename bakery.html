<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัญชีร้านขนม</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;font-size:19px;margin:0;padding:16px;background:#fff8f0;color:#333}
  .label{font-weight:bold}
  .field{margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
  .list{display:grid;gap:8px;margin:6px 0 16px}
  .btn{padding:16px 8px;font-size:19px;border:2px solid #ddd;border-radius:12px;background:#fff;color:#333}
  .btn.on{border-color:#f08c00;background:#fff1db;font-weight:bold}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:8px 14px;font-size:16px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#333}
  input{width:100%;box-sizing:border-box;padding:13px;font-size:20px;border:1px solid #ccc;border-radius:10px;margin-top:6px}
  .save{width:100%;padding:18px;font-size:22px;color:#fff;border:none;border-radius:12px;margin-top:4px}
  .hide{display:none}
  h2{margin:8px 0}
  h3{margin:22px 0 8px}
  .card{background:#fff;border-radius:12px;padding:14px;margin:12px 0;line-height:1.6}
  .big{font-size:28px;font-weight:bold}
  .up{color:#06a74b}
  .down{color:#e53935}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:17px}
  td,th{border:1px solid #eee;padding:8px;text-align:right}
  td:first-child,th:first-child{text-align:left}
  .hrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:16px}
  .hrow .m{width:64px}
  .hrow .track{flex:1;background:#eee;border-radius:6px;height:18px;overflow:hidden}
  .hrow .bar{height:18px}
  .hrow .v{width:90px;text-align:right}
  .rec{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec small{color:#777;font-size:15px}
  .del{padding:10px 16px;font-size:17px;border:1px solid #e53935;color:#e53935;background:#fff;border-radius:10px}
</style>
</head>
<body>
<script>
window.onerror = function (msg) {
  document.body.insertAdjacentHTML('afterbegin',
    '<p style="color:red;font-size:18px">โค้ดผิดพลาด: ' + msg + '</p>');
};
</script>

<div id="formPage" class="hide">
  <div class="label">ประเภท</div>
  <div class="grid2" id="types"></div>

  <div id="sellBox">
    <div class="label">ขนม</div>
    <div class="list" id="products"></div>
    <div class="field">
      <div class="label">รายละเอียดเพิ่มเติม (ไม่ใส่ก็ได้)</div>
      <input id="sellDetail" placeholder="เช่น ฝากขายร้านน้องอุ้ม">
    </div>
  </div>

  <div id="buyBox" class="hide">
    <div class="field">
      <div class="label">ซื้ออะไร</div>
      <input id="item" placeholder="เช่น แป้ง+น้ำไข่">
      <div class="chips" id="itemChips"></div>
    </div>
  </div>

  <div class="field">
    <div class="label">จำนวน (ไม่ใส่ก็ได้)</div>
    <input id="qty" type="number" inputmode="decimal">
    <div class="chips" id="units"></div>
  </div>
  <div class="field"><div class="label">จำนวนเงิน (บาท)</div><input id="amount" type="number" inputmode="decimal"></div>
  <div class="field"><div class="label">วันที่</div><input id="date" type="date"></div>
  <div class="field"><div class="label">หมายเหตุ (ไม่ใส่ก็ได้)</div><input id="note"></div>
  <button class="save" id="saveBtn">บันทึก</button>
</div>

<div id="summaryPage" class="hide">
  <h2>สรุปร้านขนม</h2>
  <input id="month" type="month">
  <div id="result"></div>
</div>

<script>
const LIFF_ID = '2012048654-QIYLgTa0';
const API_URL = 'https://script.google.com/macros/s/AKfycbzvKwdttgggZTnsPdf_QCbwFBi_5gcGlkazDuOZwtAMeSh6369GTJqKgBsaZodhW_qWfA/exec';
const PRODUCTS = ['ทาร์ตไข่', 'ขนมปังเนยกรอบ', 'ขนมปังป๊อปคาราเมล'];
const UNITS = ['กล่อง', 'ชิ้น', 'ถุง', 'แพ็ค'];
const DEFAULT_ITEMS = ['แป้ง+น้ำไข่', 'น้ำไข่', 'ถุงพลาสติก', 'กล่องใส่', 'กลิ่นวานิลลา'];
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const st = { type: 'รับ', product: '', unit: 'กล่อง' };
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthLabel = ym => {
  const [y, m] = ym.split('-').map(Number);
  return TH_MONTHS[m - 1] + ' ' + String(y + 543).slice(2);
};

function buttons(el, items, key, cls) {
  el.innerHTML = '';
  items.forEach(it => {
    const [v, label] = Array.isArray(it) ? it : [it, it];
    const b = document.createElement('button');
    b.className = (cls || 'btn') + (String(st[key]) === String(v) ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { st[key] = v; render(); };
    el.appendChild(b);
  });
}

function chips(el, items, inputId) {
  el.innerHTML = '';
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = v;
    b.onclick = () => { $(inputId).value = v; };
    el.appendChild(b);
  });
}

function render() {
  const sell = st.type === 'รับ';
  buttons($('types'), [['รับ', 'ขายได้'], ['จ่าย', 'ซื้อของ']], 'type');
  buttons($('products'), PRODUCTS, 'product');
  buttons($('units'), UNITS, 'unit', 'chip');
  $('sellBox').classList.toggle('hide', !sell);
  $('buyBox').classList.toggle('hide', sell);
  $('saveBtn').style.background = sell ? '#06c755' : '#ff7a00';
  $('saveBtn').textContent = sell ? 'บันทึกรายรับ' : 'บันทึกรายจ่าย';
}

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...payload, idToken: liff.getIDToken() })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

async function loadOptions() {
  try {
    const o = await api({ action: 'options' });
    chips($('itemChips'), [...new Set([...o.items, ...DEFAULT_ITEMS])].slice(0, 10), 'item');
  } catch (e) {}
}

$('saveBtn').onclick = async () => {
  const sell = st.type === 'รับ';
  const amount = Number($('amount').value);
  const item = $('item').value.trim();
  const sellDetail = $('sellDetail').value.trim();
  const qty = $('qty').value;
  if (sell && !st.product) return alert('กรุณาเลือกขนม');
  if (!sell && !item) return alert('กรุณาใส่รายการที่ซื้อ');
  if (!(amount > 0)) return alert('กรุณาใส่จำนวนเงิน');
  
  // ถ้าเป็นรายรับ จะเอาชื่อขนม + รายละเอียด (ถ้ามี) ไปใส่ช่อง Description
  const what = sell ? (sellDetail ? st.product + ' - ' + sellDetail : st.product) : item;
  const qtyText = Number(qty) > 0 ? qty + ' ' + st.unit + '\n' : '';
  if (!confirm(`${sell ? 'รายรับ' : 'รายจ่าย'}: ${what}\n${qtyText}${fmt(amount)} บาท\nถูกต้องไหม?`)) return;

  const btnText = $('saveBtn').textContent;
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'กำลังบันทึก...';
  try {
    await api({ action: 'add', data: {
      type: st.type, date: $('date').value, product: st.product, item, sellDetail,
      qty, unit: st.unit, amount, note: $('note').value
    }});
    alert('บันทึกเรียบร้อย ✅');
    ['amount', 'qty', 'note', 'item', 'sellDetail'].forEach(id => $(id).value = '');
    loadOptions();
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  }
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = btnText;
};

async function loadSummary() {
  $('result').textContent = 'กำลังโหลด...';
  try {
    const s = await api({ action: 'summary', month: $('month').value });
    $('result').innerHTML = totalsHtml(s) + productsHtml(s.products)
      + recordsHtml(s.records) + historyHtml(s.history);
    document.querySelectorAll('.del').forEach(b =>
      b.onclick = () => delRecord(b.dataset.row, b.dataset.key, b.dataset.info));
  } catch (e) {
    $('result').textContent = 'โหลดไม่สำเร็จ: ' + e.message;
  }
}

function totalsHtml(s) {
  const c = s.current, p = s.previous;
  const profit = c.income - c.expense, prev = p.income - p.expense, diff = profit - prev;
  let cmp = '<small>เดือนก่อนยังไม่มีข้อมูล</small>';
  if (p.income || p.expense) {
    if (diff === 0) cmp = 'เท่ากับเดือนก่อน';
    else {
      const pct = prev ? ` (${diff > 0 ? '+' : ''}${Math.round(diff / Math.abs(prev) * 100)}%)` : '';
      cmp = `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲ ดีกว่า' : '▼ น้อยกว่า'}เดือนก่อน ${fmt(Math.abs(diff))} บาท${pct}</span>`;
    }
  }
  return `<div class="card">
    ขายได้ <b>${fmt(c.income)}</b> บาท<br>
    ซื้อของ <b>${fmt(c.expense)}</b> บาท<br>
    ${profit >= 0 ? 'กำไร' : 'ขาดทุน'} <span class="big ${profit >= 0 ? 'up' : 'down'}">${fmt(Math.abs(profit))}</span> บาท<br>
    ${cmp}</div>`;
}

function productsHtml(list) {
  if (!list.length) return '';
  let h = '<h3>ยอดขายแยกตามขนม</h3><table><tr><th>ขนม</th><th>จำนวน</th><th>ยอดขาย</th></tr>';
  list.forEach(p => h += `<tr><td>${esc(p.name)}</td><td>${fmt(p.qty)}</td><td>${fmt(p.amount)}</td></tr>`);
  return h + '</table>';
}

function recordsHtml(list) {
  let out = `<h3>รายการในเดือนนี้ (${list.length})</h3>`;
  if (!list.length) return out + '<div class="card">ยังไม่มีรายการ</div>';
  list.forEach(r => {
    const [, m, d] = r.date.split('-');
    const isIn = r.inc > 0, amt = isIn ? r.inc : r.out;
    const info = `${isIn ? 'รายรับ' : 'รายจ่าย'} ${r.desc} ${fmt(amt)} บาท (วันที่ ${Number(d)})`;
    out += `<div class="rec"><div>
      <b class="${isIn ? 'up' : 'down'}">${isIn ? '+' : '−'}${fmt(amt)}</b> ${esc(r.desc)}<br>
      <small>${Number(d)} ${TH_MONTHS[m - 1] || ''}${r.qty ? ' · ' + esc(r.qty) : ''}${r.note ? ' · ' + esc(r.note) : ''}</small>
      </div>
      <button class="del" data-row="${r.row}" data-key="${esc(r.key)}" data-info="${esc(info)}">ลบ</button></div>`;
  });
  return out;
}

function historyHtml(h) {
  const max = Math.max(1, ...h.map(x => Math.abs(x.profit)));
  let out = '<h3>กำไร 12 เดือนย้อนหลัง</h3><div class="card">';
  h.slice().reverse().forEach(x => {
    const w = Math.round(Math.abs(x.profit) / max * 100);
    const color = x.profit >= 0 ? '#06c755' : '#e53935';
    out += `<div class="hrow"><span class="m">${monthLabel(x.month)}</span>
      <div class="track"><div class="bar" style="width:${w}%;background:${color}"></div></div>
      <span class="v ${x.profit >= 0 ? 'up' : 'down'}">${fmt(x.profit)}</span></div>`;
  });
  return out + '</div>';
}

async function delRecord(row, key, info) {
  if (!confirm('ต้องการลบรายการนี้ใช่ไหม?\n' + info)) return;
  try {
    await api({ action: 'delete', row, key });
    alert('ลบเรียบร้อย');
    loadSummary();
  } catch (e) {
    alert('ลบไม่สำเร็จ: ' + e.message);
  }
}

(async () => {
  try {
    if (LIFF_ID.includes('ใส่')) throw new Error('ยังไม่ได้ใส่ LIFF_ID ในโค้ด');
    if (API_URL.includes('ใส่')) throw new Error('ยังไม่ได้ใส่ API_URL ในโค้ด');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login();
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
    $('date').value = today;
    $('month').value = today.slice(0, 7);
    const p = new URLSearchParams(location.search);
    if (p.get('page') === 'summary') {
      $('summaryPage').classList.remove('hide');
      $('month').onchange = loadSummary;
      loadSummary();
    } else {
      if (p.get('type') === 'out') st.type = 'จ่าย';
      $('formPage').classList.remove('hide');
      render();
      loadOptions();
    }
  } catch (e) {
    document.body.innerHTML =
      '<div style="padding:20px;font-size:20px;color:red">เปิดไม่สำเร็จ<br>' +
      (e.message || e) + '</div>';
  }
})();
</script>
</body>
</html>

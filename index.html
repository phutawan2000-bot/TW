<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกรายรับรายจ่าย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;font-size:20px;margin:0;padding:16px;background:#f5f5f5}
  .label{margin-top:4px;font-weight:bold}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 18px}
  .btn{padding:18px 6px;font-size:20px;border:2px solid #ccc;border-radius:12px;background:#fff}
  .btn.on{border-color:#06c755;background:#e6f9ee;font-weight:bold}
  input{width:100%;box-sizing:border-box;padding:14px;font-size:22px;border:1px solid #ccc;border-radius:10px;margin:6px 0 18px}
  .save{width:100%;padding:20px;font-size:24px;color:#fff;border:none;border-radius:12px}
  .hide{display:none}
  h2{margin:8px 0}
  h3{margin:22px 0 8px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;line-height:1.6}
  .big{font-size:28px;font-weight:bold}
  .up{color:#06a74b}
  .down{color:#e53935}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:18px}
  td,th{border:1px solid #ddd;padding:8px;text-align:right}
  td:first-child,th:first-child{text-align:left}
  .hrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:16px}
  .hrow .m{width:64px}
  .hrow .track{flex:1;background:#eee;border-radius:6px;height:18px;overflow:hidden}
  .hrow .bar{height:18px}
  .hrow .v{width:90px;text-align:right}
  .rec{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rec small{color:#777;font-size:16px}
  .del{padding:10px 16px;font-size:18px;border:1px solid #e53935;color:#e53935;background:#fff;border-radius:10px}
</style>
</head>
<body>
<script>
window.onerror = function (msg) {
  document.body.insertAdjacentHTML('afterbegin',
    '<p style="color:red;font-size:18px">โค้ดผิดพลาด: ' + msg + '</p>');
};
</script>

<div id="formPage" class="hide">
  <div class="label">ประเภท</div><div class="grid2" id="types"></div>
  <div class="label">กิจการ</div><div class="grid3" id="biz"></div>
  <div class="label">จำนวนเงิน (บาท)</div><input id="amount" type="number" inputmode="decimal">
  <div id="litersBox" class="hide"><div class="label">จำนวนลิตร (ไม่ใส่ก็ได้)</div><input id="liters" type="number" inputmode="decimal"></div>
  <div class="label">วันที่</div><input id="date" type="date">
  <div class="label">หมายเหตุ (ไม่ใส่ก็ได้)</div><input id="note" placeholder="เช่น ค่าไฟ, ค่าเช่าห้อง">
  <button class="save" id="saveBtn">บันทึก</button>
</div>

<div id="summaryPage" class="hide">
  <h2>สรุปประจำเดือน</h2>
  <input id="month" type="month">
  <div id="result"></div>
</div>

<script>
const LIFF_ID = '2011999457-wLrRoiw5';
const API_URL = 'https://script.google.com/macros/s/AKfycbyQ2Bq4U6HiBsPE8blnMhmfPP720MoX_WTcMZ8of6TJz0c_ncqqjv_U8QMyt8L9RvcG/exec';
const BUSINESSES = ['ตู้น้ำมัน', 'ตู้ล้างรถ', 'บ้านเช่า','ตู้ซักผ้า'];
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const st = { type: 'รับ', business: '' };
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('th-TH');
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthLabel = ym => {
  const [y, m] = ym.split('-').map(Number);
  return TH_MONTHS[m - 1] + ' ' + String(y + 543).slice(2);
};

// ---------- ฟอร์มบันทึก ----------
function buttons(el, items, key) {
  el.innerHTML = '';
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'btn' + (st[key] === v ? ' on' : '');
    b.textContent = v;
    b.onclick = () => { st[key] = v; render(); };
    el.appendChild(b);
  });
}

function render() {
  buttons($('types'), ['รับ', 'จ่าย'], 'type');
  buttons($('biz'), BUSINESSES, 'business');
  const showLiters = st.type === 'จ่าย' && st.business === 'ตู้น้ำมัน';
  $('litersBox').classList.toggle('hide', !showLiters);
  if (!showLiters) $('liters').value = '';
  $('saveBtn').style.background = st.type === 'รับ' ? '#06c755' : '#ff7a00';
  $('saveBtn').textContent = st.type === 'รับ' ? 'บันทึกรายรับ' : 'บันทึกรายจ่าย';
}

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...payload, idToken: liff.getIDToken() })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

$('saveBtn').onclick = async () => {
  const amount = Number($('amount').value);
  if (!st.business) return alert('กรุณาเลือกกิจการ');
  if (!(amount > 0)) return alert('กรุณาใส่จำนวนเงิน');
  const label = st.type === 'รับ' ? 'รายรับ' : 'รายจ่าย';
  if (!confirm(`${label} ${st.business}\n${fmt(amount)} บาท\nถูกต้องไหม?`)) return;
  const btnText = $('saveBtn').textContent;
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'กำลังบันทึก...';
  try {
    await api({ action: 'add', data: {
      date: $('date').value, type: st.type, business: st.business,
      amount, liters: $('liters').value, note: $('note').value
    }});
    alert('บันทึกเรียบร้อย ✅');
    $('amount').value = ''; $('liters').value = ''; $('note').value = '';
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  }
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = btnText;
};

// ---------- หน้าสรุป ----------
async function loadSummary() {
  $('result').textContent = 'กำลังโหลด...';
  try {
    const s = await api({ action: 'summary', month: $('month').value });
    $('result').innerHTML = totalsHtml(s) + businessHtml(s.current)
                          + recordsHtml(s.records) + historyHtml(s.history);
    document.querySelectorAll('.del').forEach(b =>
      b.onclick = () => delRecord(b.dataset.row, b.dataset.ts, b.dataset.info));
  } catch (e) {
    $('result').textContent = 'โหลดไม่สำเร็จ: ' + e.message;
  }
}

function totalsHtml(s) {
  const c = s.current, p = s.previous;
  const profit = c.income - c.expense, prev = p.income - p.expense, diff = profit - prev;
  let cmp = '<small>เดือนก่อนยังไม่มีข้อมูล</small>';
  if (p.income || p.expense) {
    if (diff === 0) cmp = 'เท่ากับเดือนก่อน';
    else {
      const pct = prev ? ` (${diff > 0 ? '+' : ''}${Math.round(diff / Math.abs(prev) * 100)}%)` : '';
      cmp = `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲ มากกว่า' : '▼ น้อยกว่า'}เดือนก่อน ${fmt(Math.abs(diff))} บาท${pct}</span>`;
    }
  }
  return `<div class="card">
    รายรับ <b>${fmt(c.income)}</b> บาท<br>
    รายจ่าย <b>${fmt(c.expense)}</b> บาท<br>
    ${profit >= 0 ? 'กำไร' : 'ขาดทุน'} <span class="big ${profit >= 0 ? 'up' : 'down'}">${fmt(Math.abs(profit))}</span> บาท<br>
    ${cmp}</div>`;
}

function businessHtml(c) {
  let h = '<table><tr><th>กิจการ</th><th>รับ</th><th>จ่าย</th><th>กำไร</th></tr>';
  for (const [b, v] of Object.entries(c.byBusiness))
    h += `<tr><td>${esc(b)}</td><td>${fmt(v.income)}</td><td>${fmt(v.expense)}</td><td>${fmt(v.income - v.expense)}</td></tr>`;
  return h + '</table>';
}

function recordsHtml(list) {
  let out = `<h3>รายการในเดือนนี้ (${list.length})</h3>`;
  if (!list.length) return out + '<div class="card">ยังไม่มีรายการ</div>';
  list.forEach(r => {
    const [, m, d] = r.date.split('-');
    const info = `${r.type} ${r.business} ${fmt(r.amount)} บาท (วันที่ ${Number(d)})`;
    out += `<div class="rec"><div>
      <b class="${r.type === 'รับ' ? 'up' : 'down'}">${r.type === 'รับ' ? '+' : '−'}${fmt(r.amount)}</b> ${esc(r.business)}<br>
      <small>${Number(d)} ${TH_MONTHS[m - 1]} · ${esc(r.by)}${r.note ? ' · ' + esc(r.note) : ''}</small>
      </div>
      <button class="del" data-row="${r.row}" data-ts="${r.ts}" data-info="${esc(info)}">ลบ</button></div>`;
  });
  return out;
}

function historyHtml(h) {
  const max = Math.max(1, ...h.map(x => Math.abs(x.profit)));
  let out = '<h3>กำไร 12 เดือนย้อนหลัง</h3><div class="card">';
  h.slice().reverse().forEach(x => {
    const w = Math.round(Math.abs(x.profit) / max * 100);
    const color = x.profit >= 0 ? '#06c755' : '#e53935';
    out += `<div class="hrow"><span class="m">${monthLabel(x.month)}</span>
      <div class="track"><div class="bar" style="width:${w}%;background:${color}"></div></div>
      <span class="v ${x.profit >= 0 ? 'up' : 'down'}">${fmt(x.profit)}</span></div>`;
  });
  return out + '</div>';
}

async function delRecord(row, ts, info) {
  if (!confirm('ต้องการลบรายการนี้ใช่ไหม?\n' + info)) return;
  try {
    await api({ action: 'delete', row, ts });
    alert('ลบเรียบร้อย');
    loadSummary();
  } catch (e) {
    alert('ลบไม่สำเร็จ: ' + e.message);
  }
}

// ---------- เริ่มต้น ----------
(async () => {
  try {
    if (LIFF_ID.includes('ใส่')) throw new Error('ยังไม่ได้ใส่ LIFF_ID ในโค้ด');
    if (API_URL.includes('ใส่')) throw new Error('ยังไม่ได้ใส่ API_URL ในโค้ด');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login();
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
    $('date').value = today;
    $('month').value = today.slice(0, 7);
    const p = new URLSearchParams(location.search);
    if (p.get('page') === 'summary') {
      $('summaryPage').classList.remove('hide');
      $('month').onchange = loadSummary;
      loadSummary();
    } else {
      if (p.get('type') === 'out') st.type = 'จ่าย';
      $('formPage').classList.remove('hide');
      render();
    }
  } catch (e) {
    document.body.innerHTML =
      '<div style="padding:20px;font-size:20px;color:red">เปิดไม่สำเร็จ<br>' +
      (e.message || e) + '</div>';
  }
})();
</script>
</body>
</html>

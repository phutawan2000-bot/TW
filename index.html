<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกรายรับรายจ่าย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;font-size:20px;margin:0;padding:16px;background:#f5f5f5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
  .btn{padding:16px;font-size:20px;border:2px solid #ccc;border-radius:12px;background:#fff}
  .btn.on{border-color:#06c755;background:#e6f9ee;font-weight:bold}
  input{width:100%;box-sizing:border-box;padding:14px;font-size:22px;border:1px solid #ccc;border-radius:10px;margin:6px 0 18px}
  .save{width:100%;padding:20px;font-size:24px;background:#06c755;color:#fff;border:none;border-radius:12px}
  .hide{display:none}
  table{width:100%;border-collapse:collapse;background:#fff}
  td,th{border:1px solid #ddd;padding:8px;text-align:right}
  td:first-child,th:first-child{text-align:left}
</style>
</head>
<body>
<div id="formPage" class="hide">
  <div>ประเภท</div><div class="grid" id="types"></div>
  <div>ตู้</div><div class="grid" id="machines"></div>
  <div>หมวด</div><div class="grid" id="cats"></div>
  <div>จำนวนเงิน (บาท)</div><input id="amount" type="number" inputmode="decimal">
  <div id="litersBox" class="hide">จำนวนลิตร<input id="liters" type="number" inputmode="decimal"></div>
  <div>วันที่</div><input id="date" type="date">
  <div>หมายเหตุ (ไม่ใส่ก็ได้)</div><input id="note">
  <button class="save" id="saveBtn">บันทึก</button>
</div>

<div id="summaryPage" class="hide">
  <h2>สรุปประจำเดือน</h2>
  <input id="month" type="month">
  <div id="result"></div>
</div>

<script>
const LIFF_ID = '2011999457-wLrRoiw5';
const API_URL = 'https://script.google.com/macros/s/AKfycbwUcs9tClY5bt67F4NJW-GPPJNwLWfb4QdP7WXM3ZqoCSLOrcUnxg5EniyJujfVe_EN/exec
';
const MACHINES = ['ตู้น้ำมัน 1','ตู้น้ำมัน 2','ตู้น้ำมัน 3','ล้างรถ','ส่วนกลาง'];
const CATS = {
  'รับ': ['เก็บเงินตู้','อื่นๆ'],
  'จ่าย': ['ซื้อน้ำมัน','ค่าไฟ','ค่าน้ำ','น้ำยา/แว็กซ์','ซ่อมบำรุง','ค่าเช่าที่','อื่นๆ']
};
const st = { type: 'รับ', machine: '', category: 'เก็บเงินตู้' };
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('th-TH');

function buttons(el, items, key, onPick) {
  el.innerHTML = '';
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'btn' + (st[key] === v ? ' on' : '');
    b.textContent = v;
    b.onclick = () => { st[key] = v; onPick && onPick(); render(); };
    el.appendChild(b);
  });
}

function render() {
  buttons($('types'), ['รับ','จ่าย'], 'type', () => { st.category = CATS[st.type][0]; });
  buttons($('machines'), MACHINES, 'machine');
  buttons($('cats'), CATS[st.type], 'category');
  $('litersBox').classList.toggle('hide', st.category !== 'ซื้อน้ำมัน');
}

async function api(payload) {
  // ใช้ text/plain เพื่อเลี่ยง CORS preflight ซึ่ง Apps Script ไม่รองรับ
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...payload, idToken: liff.getIDToken() })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

$('saveBtn').onclick = async () => {
  const amount = Number($('amount').value);
  if (!st.machine) return alert('กรุณาเลือกตู้');
  if (!(amount > 0)) return alert('กรุณาใส่จำนวนเงิน');
  if (!confirm(`${st.type} ${fmt(amount)} บาท\n${st.machine} - ${st.category}\nถูกต้องไหม?`)) return;
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'กำลังบันทึก...';
  try {
    await api({ action: 'add', data: {
      date: $('date').value, type: st.type, machine: st.machine,
      category: st.category, amount, liters: $('liters').value, note: $('note').value
    }});
    alert('บันทึกเรียบร้อย ✅');
    $('amount').value = ''; $('liters').value = ''; $('note').value = '';
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  }
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = 'บันทึก';
};

async function loadSummary() {
  $('result').textContent = 'กำลังโหลด...';
  try {
    const s = await api({ action: 'summary', month: $('month').value });
    let h = `<p>รายรับ <b>${fmt(s.income)}</b> บาท<br>
             รายจ่าย <b>${fmt(s.expense)}</b> บาท<br>
             กำไร <b style="color:${s.profit >= 0 ? 'green' : 'red'}">${fmt(s.profit)}</b> บาท</p>
             <table><tr><th>ตู้</th><th>รับ</th><th>จ่าย</th><th>กำไร</th></tr>`;
    for (const [m, v] of Object.entries(s.byMachine))
      h += `<tr><td>${m}</td><td>${fmt(v.income)}</td><td>${fmt(v.expense)}</td><td>${fmt(v.income - v.expense)}</td></tr>`;
    $('result').innerHTML = h + '</table>';
  } catch (e) {
    $('result').textContent = 'โหลดไม่สำเร็จ: ' + e.message;
  }
}

(async () => {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) return liff.login();
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }); // YYYY-MM-DD
  $('date').value = today;
  $('month').value = today.slice(0, 7);
  const p = new URLSearchParams(location.search);
  if (p.get('page') === 'summary') {
    $('summaryPage').classList.remove('hide');
    $('month').onchange = loadSummary;
    loadSummary();
  } else {
    if (p.get('type') === 'out') { st.type = 'จ่าย'; st.category = CATS['จ่าย'][0]; }
    $('formPage').classList.remove('hide');
    render();
  }
})();
</script>
</body>
</html>
